<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen Swiper</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="1" y="3" width="20" height="14" rx="2" stroke="#5a6fff" stroke-width="1.8"/>
        <path d="M7 17l-2 2M15 17l2 2M6 19h10" stroke="#5a6fff" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M8 9l3 3 3-3" stroke="#5a6fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Screen Swiper
    </div>
    <div class="header-right">
      <span class="status-pill" id="status-pill">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-label">Connecting…</span>
      </span>
      <div class="users-bar" id="users-bar"></div>
    </div>
  </header>

  <main id="main">
    <div class="empty-state" id="empty-state">
      <div class="pulse-rings">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
      </div>
      <svg class="empty-icon" width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect x="4" y="8" width="40" height="28" rx="4" stroke="#5a6fff" stroke-width="2"/>
        <path d="M16 36l-4 4M32 36l4 4M12 40h24" stroke="#5a6fff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="24" cy="22" r="6" stroke="#5a6fff" stroke-width="2"/>
        <path d="M24 19v3l2 2" stroke="#5a6fff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h2>Scanning the network…</h2>
      <p>Other devices running Screen Swiper on the same Wi-Fi will appear here automatically.</p>
    </div>

    <div class="screens-grid" id="screens-grid" style="display:none"></div>
  </main>

  <!-- Enlarged view modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal-inner" id="modal-inner">
      <video id="modal-video" autoplay muted playsinline></video>
      <div class="modal-footer">
        <span class="modal-label" id="modal-label"></span>
        <button class="modal-fs-btn" id="modal-fs-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Fullscreen
        </button>
      </div>
    </div>
    <button class="modal-close-btn" id="modal-close">✕</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
